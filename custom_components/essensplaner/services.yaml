import_catalog:
  target:
    entity:
      - integration: essensplaner
        domain: sensor
  name: Gerichte importieren
  description: Importiert die Gerichteliste aus dem JSON-Export der Essensplaner-Site.
  fields:
    catalog:
      name: Exportdatei
      description: Vollständigen JSON-Inhalt des Site-Exports.
      required: true
      selector:
        object:
plan_day:
  target:
    entity:
      - integration: essensplaner
        domain: sensor
  name: Tag planen
  description: Plant oder ändert das Essen für einen Tag.
  fields:
    date:
      name: Datum
      required: true
      selector:
        date: {}
    meal_id:
      name: Gespeichertes Gericht
      selector:
        text: {}
    text:
      name: Freitext
      selector:
        text: {}
    link:
      name: Link
      selector:
        text: {}
    clear:
      name: Löschen
      selector:
        boolean: {}
show_week:
  target:
    entity:
      - integration: essensplaner
        domain: sensor
  name: Woche anzeigen
  description: Wechselt zur Woche eines Datums.
  fields:
    date:
      name: Datum
      selector:
        date: {}
save_meal:
  target:
    entity:
      - integration: essensplaner
        domain: sensor
  name: Gericht speichern
  description: Fügt ein Gericht hinzu oder aktualisiert es.
  fields:
    id:
      name: Gericht-ID
      selector:
        text: {}
    name:
      name: Gericht
      required: true
      selector:
        text: {}
    meat:
      name: Mit Fleisch
      required: true
      selector:
        boolean: {}
    eaters:
      name: Wer isst das Gericht?
      required: true
      selector:
        select:
          multiple: true
          options:
            - Vera
            - Manuel
            - Maximilian
            - Paul
delete_meal:
  target:
    entity:
      - integration: essensplaner
        domain: sensor
  name: Gericht löschen
  description: Entfernt ein gespeichertes Gericht.
  fields:
    id:
      name: Gericht-ID
      required: true
      selector:
        text: {}
